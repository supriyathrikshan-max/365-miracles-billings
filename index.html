<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>365 Miracles - Billing & Reports</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .toast-slide { animation: slideDown 0.3s ease-out forwards; }
    @keyframes slideDown {
      from { transform: translate(-50%, -100%); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <!-- Toast Notification Container -->
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 hidden toast-slide w-11/12 max-w-md">
    <div class="bg-emerald-600 text-white px-5 py-3.5 rounded-xl shadow-2xl flex items-center justify-between border border-emerald-400/30">
      <div class="flex items-center space-x-3">
        <div class="bg-white/20 p-1.5 rounded-full">
          <i data-lucide="check-circle" class="w-6 h-6 text-white"></i>
        </div>
        <div>
          <h4 class="font-bold text-sm">Bill Submitted Successfully!</h4>
          <p id="toast-message" class="text-xs text-emerald-100 mt-0.5"></p>
        </div>
      </div>
      <button onclick="closeToast()" class="text-emerald-200 hover:text-white p-1">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700/60 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-amber-500/20 p-2 rounded-xl border border-amber-500/30">
          <i data-lucide="sparkles" class="w-6 h-6 text-amber-400"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-lg sm:text-xl tracking-tight text-white">365 Miracles</h1>
          <p class="text-xs text-slate-400 font-medium">Snacks Shop Billing</p>
        </div>
      </div>
      <!-- Tab Navigation Buttons -->
      <div class="flex bg-slate-900/80 p-1 rounded-xl border border-slate-700/50">
        <button id="btn-billing" onclick="switchTab('billing')" class="flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all bg-amber-500 text-slate-950 shadow-md">
          <i data-lucide="receipt" class="w-4 h-4"></i>
          <span>Billing</span>
        </button>
        <button id="btn-reports" onclick="switchTab('reports')" class="flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-400 hover:text-slate-200">
          <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
          <span>Reports</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6">

    <!-- BILLING VIEW -->
    <section id="view-billing" class="space-y-6 max-w-md mx-auto pt-2 sm:pt-6">
      <div class="bg-slate-800/90 rounded-2xl border border-slate-700/80 shadow-xl p-6 sm:p-8 backdrop-blur-sm">
        <div class="mb-6 text-center">
          <h2 class="text-xl font-bold text-white">New Sale Entry</h2>
          <p class="text-xs text-slate-400 mt-1">Enter customer mobile number and total bill amount</p>
        </div>

        <form id="billing-form" onsubmit="handleBillSubmit(event)" class="space-y-5">
          <!-- Mobile Number -->
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">
              Mobile Number <span class="text-amber-400">*</span>
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <i data-lucide="phone" class="w-5 h-5"></i>
              </div>
              <input 
                type="tel" 
                id="customer-mobile" 
                required 
                pattern="[0-9]{10}"
                minlength="10"
                maxlength="10"
                oninput="this.value = this.value.replace(/[^0-9]/g, '');"
                placeholder="Enter 10-digit mobile number"
                class="w-full bg-slate-900/90 border border-slate-700 rounded-xl pl-11 pr-4 py-3 text-white text-base font-medium placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
              >
            </div>
          </div>

          <!-- Total Bill Amount -->
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">
              Total Amount (₹) <span class="text-amber-400">*</span>
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-amber-400 font-bold text-lg">
                ₹
              </div>
              <input 
                type="number" 
                id="bill-amount" 
                required 
                min="1"
                step="any"
                placeholder="0.00"
                class="w-full bg-slate-900/90 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-white text-xl font-bold placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
              >
            </div>
          </div>

          <!-- Submit Button -->
          <button 
            type="submit" 
            id="submit-btn"
            class="w-full mt-4 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-extrabold py-3.5 px-6 rounded-xl shadow-lg shadow-amber-500/20 flex items-center justify-center space-x-2 transition-all transform active:scale-[0.98]"
          >
            <i data-lucide="check-circle-2" class="w-5 h-5"></i>
            <span>Submit Bill</span>
          </button>
        </form>
      </div>
    </section>

    <!-- REPORTS VIEW -->
    <section id="view-reports" class="hidden space-y-6">
      
      <!-- Search & Date Filter Header -->
      <div class="bg-slate-800/80 rounded-2xl border border-slate-700/70 p-4 sm:p-5 space-y-4">
        
        <!-- Top Row: Mobile Search Bar -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
          <div class="relative w-full sm:max-w-xs">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="search" class="w-4 h-4"></i>
            </div>
            <input 
              type="text" 
              id="search-mobile" 
              oninput="renderReports()" 
              placeholder="Search Mobile Number..." 
              class="w-full bg-slate-900/90 border border-slate-700 rounded-xl pl-9 pr-8 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500"
            >
            <button onclick="clearMobileSearch()" class="absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-500 hover:text-slate-300">
              <i data-lucide="x-circle" class="w-4 h-4"></i>
            </button>
          </div>

          <!-- Export Button -->
          <button id="export-btn" type="button" class="w-full sm:w-auto flex items-center justify-center space-x-2 bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md transition-all active:scale-95 cursor-pointer">
            <i data-lucide="download" class="w-4 h-4"></i>
            <span>Export CSV</span>
          </button>
        </div>

        <hr class="border-slate-700/50">

        <!-- Bottom Row: Date Filters -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div class="flex flex-wrap items-center gap-2">
            <button onclick="setFilter('today')" id="filter-today" class="px-3.5 py-2 rounded-xl text-xs font-bold transition-all bg-amber-500 text-slate-950">
              Today
            </button>
            <button onclick="setFilter('month')" id="filter-month" class="px-3.5 py-2 rounded-xl text-xs font-bold transition-all bg-slate-700 text-slate-300 hover:bg-slate-600">
              This Month
            </button>
            <button onclick="setFilter('year')" id="filter-year" class="px-3.5 py-2 rounded-xl text-xs font-bold transition-all bg-slate-700 text-slate-300 hover:bg-slate-600">
              This Year
            </button>
            <button onclick="setFilter('all')" id="filter-all" class="px-3.5 py-2 rounded-xl text-xs font-bold transition-all bg-slate-700 text-slate-300 hover:bg-slate-600">
              All Time
            </button>
          </div>

          <div class="flex items-center space-x-1.5 bg-slate-900/80 border border-slate-700 rounded-xl px-2.5 py-1.5">
            <input type="date" id="date-start" onchange="setFilter('custom')" class="bg-transparent text-xs text-white focus:outline-none">
            <span class="text-slate-500 text-xs">to</span>
            <input type="date" id="date-end" onchange="setFilter('custom')" class="bg-transparent text-xs text-white focus:outline-none">
          </div>
        </div>

      </div>

      <!-- Key Metrics -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-5">
          <div class="flex items-center justify-between text-slate-400 mb-2">
            <span class="text-xs font-semibold uppercase tracking-wider">Total Revenue</span>
            <i data-lucide="indian-rupee" class="w-5 h-5 text-amber-400"></i>
          </div>
          <div id="stat-revenue" class="text-2xl sm:text-3xl font-extrabold text-amber-400">₹0</div>
        </div>

        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-5">
          <div class="flex items-center justify-between text-slate-400 mb-2">
            <span class="text-xs font-semibold uppercase tracking-wider">Total Bills</span>
            <i data-lucide="receipt" class="w-5 h-5 text-sky-400"></i>
          </div>
          <div id="stat-count" class="text-2xl sm:text-3xl font-extrabold text-white">0</div>
        </div>

        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-5">
          <div class="flex items-center justify-between text-slate-400 mb-2">
            <span class="text-xs font-semibold uppercase tracking-wider">Unique Customers</span>
            <i data-lucide="users" class="w-5 h-5 text-emerald-400"></i>
          </div>
          <div id="stat-customers" class="text-2xl sm:text-3xl font-extrabold text-white">0</div>
        </div>
      </div>

      <!-- Customer Summary Table -->
      <div class="bg-slate-800/80 rounded-2xl border border-slate-700/70 overflow-hidden shadow-xl">
        <div class="px-5 py-4 border-b border-slate-700/60 flex items-center justify-between">
          <h3 class="font-bold text-base text-white">Customer Spending Report</h3>
          <span id="report-period-label" class="text-xs font-medium text-amber-400 bg-amber-400/10 px-2.5 py-1 rounded-full border border-amber-400/20">
            Today
          </span>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-900/60 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700/60">
              <tr>
                <th class="px-5 py-3.5 font-semibold">Customer Mobile</th>
                <th class="px-5 py-3.5 font-semibold text-center">Visits / Bills</th>
                <th class="px-5 py-3.5 font-semibold text-right">Total Billed (₹)</th>
              </tr>
            </thead>
            <tbody id="customer-report-body" class="divide-y divide-slate-700/50 text-slate-200">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBoCUWDELmeOKMMqe4MiC4egmhgxdE9hyY",
      authDomain: "miracles-billing.firebaseapp.com",
      projectId: "miracles-billing",
      storageBucket: "miracles-billing.firebasestorage.app",
      messagingSenderId: "759118190852",
      appId: "1:759118190852:web:623ad6183e3b251fd65851",
      measurementId: "G-9EYGQ92QRK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const billsRef = collection(db, "bills");

    let allBills = [];
    let currentFilter = 'today';

    const q = query(billsRef, orderBy("timestamp", "desc"));
    onSnapshot(q, (snapshot) => {
      allBills = snapshot.docs.map(doc => {
        const data = doc.data();
        let dateObj = new Date();
        if (data.timestamp && data.timestamp.toDate) {
          dateObj = data.timestamp.toDate();
        }
        return {
          id: doc.id,
          mobile: data.mobile,
          amount: parseFloat(data.amount || 0),
          dateObj: dateObj
        };
      });
      renderReports();
    }, (error) => {
      console.error("Firestore error:", error);
    });

    window.handleBillSubmit = async function(e) {
      e.preventDefault();
      const mobileInput = document.getElementById('customer-mobile');
      const amountInput = document.getElementById('bill-amount');
      const submitBtn = document.getElementById('submit-btn');

      const mobile = mobileInput.value.trim();
      const amount = parseFloat(amountInput.value);

      if (!/^[0-9]{10}$/.test(mobile)) {
        alert("Please enter a valid 10-digit mobile number.");
        mobileInput.focus();
        return;
      }

      if (isNaN(amount) || amount <= 0) {
        alert("Please enter a valid bill amount.");
        amountInput.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Submitting...';

      try {
        await addDoc(billsRef, {
          mobile: mobile,
          amount: amount,
          timestamp: serverTimestamp()
        });

        showToast(`Mobile: ${mobile} | Amount: ₹${amount}`);
        mobileInput.value = '';
        amountInput.value = '';
      } catch (err) {
        alert("Error saving bill: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i data-lucide="check-circle-2" class="w-5 h-5"></i><span>Submit Bill</span>`;
        if (window.lucide) lucide.createIcons();
      }
    };

    window.switchTab = function(tab) {
      const btnBilling = document.getElementById('btn-billing');
      const btnReports = document.getElementById('btn-reports');
      const viewBilling = document.getElementById('view-billing');
      const viewReports = document.getElementById('view-reports');

      if (tab === 'billing') {
        viewBilling.classList.remove('hidden');
        viewReports.classList.add('hidden');
        btnBilling.className = "flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all bg-amber-500 text-slate-950 shadow-md";
        btnReports.className = "flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-400 hover:text-slate-200";
      } else {
        viewBilling.classList.add('hidden');
        viewReports.classList.remove('hidden');
        btnReports.className = "flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all bg-amber-500 text-slate-950 shadow-md";
        btnBilling.className = "flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-400 hover:text-slate-200";
        renderReports();
      }
    };

    window.setFilter = function(filter) {
      currentFilter = filter;
      const buttons = ['today', 'month', 'year', 'all'];
      buttons.forEach(b => {
        const btn = document.getElementById(`filter-${b}`);
        if (btn) {
          if (b === filter) {
            btn.className = "px-3.5 py-2 rounded-xl text-xs font-bold transition-all bg-amber-500 text-slate-950";
          } else {
            btn.className = "px-3.5 py-2 rounded-xl text-xs font-bold transition-all bg-slate-700 text-slate-300 hover:bg-slate-600";
          }
        }
      });
      renderReports();
    };

    window.clearMobileSearch = function() {
      const searchInput = document.getElementById('search-mobile');
      if (searchInput) {
        searchInput.value = '';
        renderReports();
      }
    };

    function getFilteredBills() {
      const now = new Date();
      const searchQuery = (document.getElementById('search-mobile')?.value || '').trim().toLowerCase();

      return allBills.filter(bill => {
        const d = bill.dateObj;
        
        // Mobile Search Filter
        if (searchQuery && !bill.mobile.toLowerCase().includes(searchQuery)) {
          return false;
        }

        // Date Filter
        if (currentFilter === 'today') {
          return d.toDateString() === now.toDateString();
        } else if (currentFilter === 'month') {
          return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        } else if (currentFilter === 'year') {
          return d.getFullYear() === now.getFullYear();
        } else if (currentFilter === 'custom') {
          const startDate = document.getElementById('date-start').value;
          const endDate = document.getElementById('date-end').value;
          if (!startDate && !endDate) return true;
          const start = startDate ? new Date(startDate) : new Date(0);
          const end = endDate ? new Date(endDate + 'T23:59:59') : new Date();
          return d >= start && d <= end;
        }
        return true;
      });
    }

    window.renderReports = function() {
      const filtered = getFilteredBills();
      
      let totalRev = 0;
      const customerMap = {};

      filtered.forEach(bill => {
        totalRev += bill.amount;
        if (!customerMap[bill.mobile]) {
          customerMap[bill.mobile] = { count: 0, total: 0 };
        }
        customerMap[bill.mobile].count += 1;
        customerMap[bill.mobile].total += bill.amount;
      });

      document.getElementById('stat-revenue').innerText = `₹${totalRev.toLocaleString('en-IN')}`;
      document.getElementById('stat-count').innerText = filtered.length;
      document.getElementById('stat-customers').innerText = Object.keys(customerMap).length;

      const labelMap = {
        'today': 'Today',
        'month': 'This Month',
        'year': 'This Year',
        'all': 'All Time',
        'custom': 'Custom Range'
      };
      
      const searchQuery = (document.getElementById('search-mobile')?.value || '').trim();
      const labelText = searchQuery ? `Search: "${searchQuery}"` : (labelMap[currentFilter] || 'Report');
      document.getElementById('report-period-label').innerText = labelText;

      const tbody = document.getElementById('customer-report-body');
      const customers = Object.keys(customerMap).map(m => ({
        mobile: m,
        count: customerMap[m].count,
        total: customerMap[m].total
      })).sort((a, b) => b.total - a.total);

      if (customers.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="px-5 py-8 text-center text-slate-500 font-medium">No matching bills found.</td></tr>`;
        return;
      }

      tbody.innerHTML = customers.map(c => `
        <tr class="hover:bg-slate-700/30 transition-colors">
          <td class="px-5 py-3.5 font-bold text-white flex items-center space-x-2">
            <i data-lucide="phone" class="w-4 h-4 text-slate-400"></i>
            <span>${c.mobile}</span>
          </td>
          <td class="px-5 py-3.5 text-center font-semibold text-slate-300">${c.count}</td>
          <td class="px-5 py-3.5 text-right font-extrabold text-amber-400">₹${c.total.toLocaleString('en-IN')}</td>
        </tr>
      `).join('');

      if (window.lucide) lucide.createIcons();
    };

    function triggerExportCSV() {
      const filtered = getFilteredBills();
      if (filtered.length === 0) {
        alert("No bills found to export.");
        return;
      }

      const rows = [["Timestamp (IST)", "Mobile Number", "Amount (INR)"]];
      filtered.forEach(b => {
        const istDate = b.dateObj.toLocaleString("en-IN", { timeZone: "Asia/Kolkata" });
        rows.push([`"${istDate}"`, `"${b.mobile}"`, b.amount]);
      });

      const searchQuery = (document.getElementById('search-mobile')?.value || '').trim();
      const fileNameTag = searchQuery ? `Mobile_${searchQuery}` : currentFilter;

      const csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.join(",")).join("\n");
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `365_Miracles_Bills_${fileNameTag}_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      toastMsg.innerText = msg;
      toast.classList.remove('hidden');

      setTimeout(() => {
        closeToast();
      }, 3500);
    }

    window.closeToast = function() {
      document.getElementById('toast').classList.add('hidden');
    };

    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) lucide.createIcons();
      
      const exportBtn = document.getElementById('export-btn');
      if (exportBtn) {
        exportBtn.addEventListener('click', triggerExportCSV);
      }
    });
  </script>
</body>
</html>
